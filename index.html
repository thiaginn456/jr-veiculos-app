  <!--
    Restaura a rota real depois do redirecionamento feito pelo 404.html do
    GitHub Pages (que não sabe nada das rotas do React Router). Sem isso,
    acessar /estoque direto ou dar F5 numa rota interna cairia sempre na
    home. Técnica: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          "",
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      }
    })(window.location);
  </script>
